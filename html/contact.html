<body>
    <nav>

    <main>
        <section id="contact-section">
        <h2>Connect with GreenTech</h2>
        <p>Ready to reduce your carbon footprint? Drop us a message.</p>
    
        <form id="contactForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" placeholder="Enter your name" required>
                <span id="nameError" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="email">Business Email:</label>
                <input type="email" id="email" placeholder="example@company.com" required>
                <span id="emailError" class="error-msg"></span>
            </div>

            <div class="form-group">
                <label for="message">How can we help?</label>
                <textarea id="message" rows="4" required></textarea>
                <span id="messageError" class="error-msg"></span>
            </div>

            <button type="submit" id="submitBtn">Send Message</button>
        </form>
    
        <div id="successMessage" style="display:none;">
            <p>Thank you! A GreenTech representative will contact you shortly.</p>
        </div>
    </section>
    </main> 
    <footer>
        <p>&copy; 2023 GreenTech Solutions</p>
    </footer>
    <script src="../script2.js"></script>
</body>
